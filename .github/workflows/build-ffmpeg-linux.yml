name: Build FFmpeg Linux Dynamic Libraries

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'build-ffmpeg-linux.sh'
      - 'download_sources.sh'
      - '.github/workflows/build-ffmpeg-linux.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'build-ffmpeg-linux.sh'
      - 'download_sources.sh'
      - '.github/workflows/build-ffmpeg-linux.yml'
  release:
    types: [published]

jobs:
  build-linux:
    name: Build FFmpeg Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config curl git libopus-dev libmp3lame-dev libfdk-aac-dev ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-linux/ccache
          key: ${{ runner.os }}-ffmpeg-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-ccache-

      - name: Download source codes
        run: |
          chmod +x download_sources.sh
          ./download_sources.sh

      - name: Build FFmpeg shared libraries (Native Host)
        env:
          INSIDE_DOCKER: "true"
        run: |
          chmod +x build-ffmpeg-linux.sh
          ./build-ffmpeg-linux.sh --jobs $(nproc)

      - name: Fix paths in pkgconfig for relocation compatibility
        run: |
          # Replace the runner host workspace path with /workspace to align with Docker build path expectations
          RUNNER_WORKSPACE_PATH="${{ github.workspace }}"
          echo "Replacing $RUNNER_WORKSPACE_PATH with /workspace in pkgconfig files"
          for pc in build/ffmpeg-linux/install/lib/pkgconfig/*.pc; do
            if [[ -f "$pc" ]]; then
              sed -i "s|$RUNNER_WORKSPACE_PATH|/workspace|g" "$pc"
            fi
          done

      - name: Package build outputs
        run: |
          cd build/ffmpeg-linux/install
          tar -czf ../../../ffmpeg_lib_linux.tar.gz .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg_lib_linux
          path: ffmpeg_lib_linux.tar.gz
          retention-days: 90

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg_lib_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
