name: Build FFmpeg Dynamic Libraries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to publish to (e.g. 0.0.1). Leave empty to compile without publishing.'
        required: false
        default: ''
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-ffmpeg.yml'
      - 'build-ffmpeg-android.sh'
      - 'build-ffmpeg-apple.sh'
      - 'build-ffmpeg-linux.sh'
      - 'download_sources.sh'
      - 'ffmpeg-vibeflow-audio/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-ffmpeg.yml'
      - 'build-ffmpeg-android.sh'
      - 'build-ffmpeg-apple.sh'
      - 'build-ffmpeg-linux.sh'
      - 'download_sources.sh'
      - 'ffmpeg-vibeflow-audio/**'
  release:
    types: [published]

jobs:
  build:
    name: Build FFmpeg ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            runner: ubuntu-22.04
            artifact_name: ffmpeg_lib_linux
            package_path: ffmpeg_lib_linux.tar.gz
          - name: Windows
            runner: windows-2025-vs2026
            artifact_name: ffmpeg_lib_windows
            package_path: ffmpeg_lib_windows.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm pkg-config curl git xz-utils ccache

      - name: Setup Linux ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-linux/ccache
          key: ${{ runner.os }}-ffmpeg-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-ccache-

      - name: Cache vcpkg downloads
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg-downloads
          key: ${{ runner.os }}-ffmpeg-vcpkg-downloads-${{ hashFiles('ffmpeg-vibeflow-audio/**') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-vcpkg-downloads-

      - name: Download source codes
        if: runner.os == 'Linux'
        run: |
          chmod +x download_sources.sh
          ./download_sources.sh

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build FFmpeg shared libraries (Linux)
        if: runner.os == 'Linux'
        env:
          INSIDE_DOCKER: "true"
        run: |
          chmod +x build-ffmpeg-linux.sh
          ./build-ffmpeg-linux.sh --jobs $(nproc)

      - name: Build FFmpeg shared libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg-downloads
        run: |
          .\vcpkg\vcpkg.exe install ffmpeg-vibeflow-audio:x64-windows-audio `
            --overlay-ports="${{ github.workspace }}" `
            --overlay-triplets="${{ github.workspace }}\ffmpeg-vibeflow-audio\triplets"

      - name: Fix paths in pkgconfig for relocation compatibility
        if: runner.os == 'Linux'
        run: |
          RUNNER_WORKSPACE_PATH="${{ github.workspace }}"
          echo "Replacing $RUNNER_WORKSPACE_PATH with /workspace in pkgconfig files"
          for pc in build/ffmpeg-linux/install/lib/pkgconfig/*.pc; do
            if [[ -f "$pc" ]]; then
              sed -i "s|$RUNNER_WORKSPACE_PATH|/workspace|g" "$pc"
            fi
          done

      - name: Package build outputs (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/ffmpeg-linux/install
          tar -czf ../../../${{ matrix.platform.package_path }} .

      - name: Package build outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg\installed\x64-windows-audio'
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE 'build\ffmpeg-windows\install'

          if (Test-Path $stageRoot) {
            Remove-Item -LiteralPath $stageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $stageRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $installRoot 'bin') -Destination $stageRoot -Recurse
          Copy-Item -LiteralPath (Join-Path $installRoot 'include') -Destination $stageRoot -Recurse
          Copy-Item -LiteralPath (Join-Path $installRoot 'lib') -Destination $stageRoot -Recurse

          $archivePath = Join-Path $env:GITHUB_WORKSPACE '${{ matrix.platform.package_path }}'
          if (Test-Path $archivePath) {
            Remove-Item -LiteralPath $archivePath -Force
          }

          Compress-Archive -Path (Join-Path $stageRoot '*') -DestinationPath $archivePath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.package_path }}
          retention-days: 90

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: ${{ matrix.platform.package_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build FFmpeg Android
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config curl git xz-utils ccache autoconf automake libtool unzip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"

      - name: Setup Android ccache
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-android/ccache
          key: android-ffmpeg-ccache-${{ github.sha }}
          restore-keys: |
            android-ffmpeg-ccache-

      - name: Download source codes
        run: |
          chmod +x download_sources.sh
          ./download_sources.sh

      - name: Build FFmpeg shared libraries (Android)
        run: |
          chmod +x build-ffmpeg-android.sh
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ./build-ffmpeg-android.sh --clean --jobs "$(nproc)" --sdk "${SDK_ROOT}" --abi arm64-v8a --abi armeabi-v7a

      - name: Package build outputs (Android)
        run: |
          tar -czf ffmpeg_lib_android.tar.gz android/ffmpeg_lib

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg_lib_android
          path: ffmpeg_lib_android.tar.gz
          retention-days: 90

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: ffmpeg_lib_android.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apple:
    name: Build FFmpeg Apple (macOS & iOS)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install nasm automake autoconf libtool pkg-config

      - name: Download source codes
        run: |
          chmod +x download_sources.sh
          ./download_sources.sh

      - name: Build FFmpeg XCFramework (Apple)
        run: |
          chmod +x build-ffmpeg-apple.sh
          ./build-ffmpeg-apple.sh --clean

      - name: Package build outputs (Apple)
        run: |
          tar -czf ffmpeg_lib_apple.tar.gz -C darwin FFmpeg.xcframework

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg_lib_apple
          path: ffmpeg_lib_apple.tar.gz
          retention-days: 90

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: ffmpeg_lib_apple.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

