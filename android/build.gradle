// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.audio_core'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.audio_core'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 35

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Compile the vendored Media3 FFmpeg extension directly from source so we
        // do not need the third-party nextlib wrapper.
        main.java.srcDirs += 'media3-src/decoder_ffmpeg/src/main/java'
    }

    defaultConfig {
        minSdkVersion 24
        consumerProguardFiles 'media3-src/decoder_ffmpeg/proguard-rules.txt'
        
        externalNativeBuild {
            cmake {
                // 开启 NEON
                arguments "-DANDROID_ARM_NEON=ON"
                cppFlags ""
            }
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                    "**/libavcodec.so",
                    "**/libavformat.so",
                    "**/libavutil.so",
                    "**/libswresample.so",
                    "**/libswscale.so",
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    def media3_version = "1.9.3"
    def checkerframework_version = "3.44.0"
    def kotlin_annotations_version = "1.9.24"

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    compileOnly "org.checkerframework:checker-qual:$checkerframework_version"
    compileOnly "org.jetbrains.kotlin:kotlin-annotations-jvm:$kotlin_annotations_version"
    implementation "com.github.wendykierp:JTransforms:3.2"
    implementation "com.github.lincollincol:Amplituda:2.3.1"
    implementation "io.github.kyant0:taglib:1.0.5"
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "audio_core"
}
