// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.audio_core'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.audio_core'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 35

    // Keep the plugin aligned with the Flutter toolchain's default NDK.
    // This avoids AGP falling back to an older side-by-side install for the
    // library module itself.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Compile the vendored Media3 FFmpeg extension directly from source so we
        // do not need the third-party nextlib wrapper.
        main.java.srcDirs += 'media3-src/decoder_ffmpeg/src/main/java'
        main.jniLibs.srcDirs += 'ffmpeg_lib'
    }

    defaultConfig {
        minSdkVersion 24
        consumerProguardFiles 'media3-src/decoder_ffmpeg/proguard-rules.txt'
        
        externalNativeBuild {
            cmake {
                // 开启 NEON
                arguments "-DANDROID_ARM_NEON=ON"
                cppFlags ""
            }
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                    "**/libavcodec.so",
                    "**/libavformat.so",
                    "**/libavutil.so",
                    "**/libswresample.so",
                    "**/libswscale.so",
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    def media3_version = "1.9.3"
    def checkerframework_version = "3.43.0"
    def kotlin_annotations_version = "1.9.24"

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-transformer:$media3_version"
    compileOnly "org.checkerframework:checker-qual:$checkerframework_version"
    compileOnly "org.jetbrains.kotlin:kotlin-annotations-jvm:$kotlin_annotations_version"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.github.wendykierp:JTransforms:3.2"
    implementation "io.github.kyant0:taglib:1.0.5"
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "audio_core"
}

task downloadFFmpeg {
    def targetDir = file("ffmpeg_lib")
    outputs.dir(targetDir)

    doLast {
        if (!targetDir.exists() || targetDir.list().length == 0) {
            println "--------------------------------------------------------"
            println "FFmpeg precompiled binaries for Android not found."
            println "Downloading from GitHub Releases..."
            println "--------------------------------------------------------"
            
            targetDir.mkdirs()
            def downloadUrl = "https://github.com/axel10/audio_core/releases/download/0.0.1/ffmpeg_lib_android.tar.gz"
            def tempFile = file("ffmpeg_lib_temp.tar.gz")
            
            try {
                def connection = new URL(downloadUrl).openConnection()
                connection.setRequestProperty("User-Agent", "Mozilla/5.0")
                connection.setConnectTimeout(15000)
                connection.setReadTimeout(30000)
                
                int status = connection.getResponseCode()
                if (status >= 300 && status < 400) {
                    def redirectUrl = connection.getHeaderField("Location")
                    connection = new URL(redirectUrl).openConnection()
                    connection.setRequestProperty("User-Agent", "Mozilla/5.0")
                    connection.setConnectTimeout(15000)
                    connection.setReadTimeout(30000)
                }
                
                connection.getInputStream().withStream { i -> 
                    tempFile.withOutputStream { it << i } 
                }
                
                println "Extracting FFmpeg binaries..."
                copy {
                    from tarTree(resources.gzip(tempFile))
                    into file(".")
                }
                println "FFmpeg binaries downloaded and extracted successfully!"
            } catch (Exception e) {
                if (tempFile.exists()) {
                    tempFile.delete()
                }
                throw new GradleScriptException("Failed to download FFmpeg precompiled libraries: " + e.getMessage(), e)
            } finally {
                if (tempFile.exists()) {
                    tempFile.delete()
                }
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith("cargokitCargoBuild") || task.name == "preBuild") {
        task.dependsOn downloadFFmpeg
    }
}
